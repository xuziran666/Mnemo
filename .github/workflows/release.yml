name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            asset: mnemo-linux-x86_64
          - platform: ubuntu-22.04-arm
            asset: mnemo-linux-aarch64
          - platform: windows-2022
            asset: mnemo-windows-x86_64.exe
          - platform: windows-11-arm
            asset: mnemo-windows-aarch64.exe
          - platform: macos-14
            asset: mnemo-macos-aarch64
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Build
        run: cargo build --release -p mnemo-egui

      - name: Stage asset (unix)
        if: "!startsWith(matrix.platform, 'windows')"
        run: cp target/release/mnemo "${{ matrix.asset }}"

      - name: Stage asset (windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: Copy-Item target/release/mnemo.exe "${{ matrix.asset }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.asset }}
