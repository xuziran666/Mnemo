name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            asset: mnemo-linux-x86_64.AppImage
            packager_format: appimage
          - platform: ubuntu-22.04-arm
            asset: mnemo-linux-aarch64.AppImage
            packager_format: appimage
          - platform: windows-2022
            asset: mnemo-windows-x86_64-setup.exe
            packager_format: nsis
          - platform: windows-11-arm
            asset: mnemo-windows-aarch64-setup.exe
            packager_format: nsis
          - platform: macos-14
            asset: mnemo-macos-aarch64.dmg
            packager_format: dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev \
            libfuse2 file rpm

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # 关键：切换到 mnemo-slint 目录执行打包，
      # packager 会自动 build，并输出到 workspace 根目录的 target/release/bundle/<format>/
      - name: Package Application
        working-directory: ./mnemo-slint
        run: cargo packager --release --format ${{ matrix.packager_format }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # packager 默认输出路径在 workspace 根的 target/release/bundle/<format>/
          files: target/release/bundle/${{ matrix.packager_format }}/*