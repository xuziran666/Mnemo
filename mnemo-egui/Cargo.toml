[package]
name = "mnemo-egui"
version = "0.3.4"
edition = "2021"
description = "Mnemo - a local command manager (pure Rust / egui)"
authors = ["xuziran666"]
license = "MIT"

[[bin]]
name = "mnemo"
path = "src/main.rs"

[dependencies]
# GUI 框架：立即模式，替代 Tauri + React
eframe = "0.36"
# 跨平台应用数据目录，用于复用 Tauri 的 commands.db 路径
dirs = "7"
# 语言资源解析
serde_json = "1"
# 原生文件对话框，替代 tauri-plugin-dialog
rfd = "0.17"
# 系统剪贴板，替代 tauri-plugin-clipboard-manager
arboard = "3"
# 纯 Rust 核心库（SQLite 持久化与业务逻辑）
mnemo-core = { path = "../mnemo-core" }
